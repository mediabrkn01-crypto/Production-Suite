<!--
  Academic → LIVE CLASSES (Google Calendar + Google Meet).
  A content FRAGMENT, not a page: academics.html fetches it the first time the Live Classes tab
  is opened and injects it into #tab-acad-liveclasses, inside the existing Academic shell
  (sidebar, header, profile, notifications, clock-in, session, update system all stay as they are).
  Logic: academic-meet.js · Styles: academic-meet.css · Backend: supabase/functions/academic-meet
-->
<div class="am" id="am-root">
  <div class="am-head">
    <div class="am-title">
      <h2 id="am-heading">Live Classes</h2>
      <p id="am-sub">Online classes with Google Meet — scheduled from Academic, invitations sent by Google Calendar.</p>
    </div>
    <div class="am-views" role="tablist" aria-label="Calendar view">
      <button type="button" role="tab" data-view="day" class="on">Today</button>
      <button type="button" role="tab" data-view="week">Week</button>
      <button type="button" role="tab" data-view="month">Month</button>
    </div>
  </div>

  <div class="am-setup" id="am-setup" hidden></div>

  <div class="am-bar">
    <div class="am-nav">
      <button type="button" class="am-ic" data-nav="-1" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
      <button type="button" class="am-today" data-nav="0">Today</button>
      <button type="button" class="am-ic" data-nav="1" aria-label="Next"><i data-lucide="chevron-right"></i></button>
      <div class="am-range" id="am-range">—</div>
    </div>
    <div class="am-tools">
      <span class="am-live" id="am-live" title="Updates live"><span></span>Live</span>
      <button type="button" class="am-btn am-btn-ghost" id="am-bulk" hidden><i data-lucide="video"></i><span>Create Meet for all</span></button>
    </div>
  </div>

  <div class="am-stats" id="am-stats"></div>
  <div class="am-body" id="am-body"><div class="am-loading">Loading live classes…</div></div>
</div>

<!-- Class details -->
<div class="am-modal-bg" id="am-modal" aria-hidden="true">
  <div class="am-modal" role="dialog" aria-modal="true" aria-labelledby="am-m-title">
    <button type="button" class="am-x" data-close aria-label="Close"><i data-lucide="x"></i></button>
    <div id="am-m-body"></div>
  </div>
</div>
